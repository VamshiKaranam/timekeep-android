name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk Timekeep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Timekeep-apk
          path: Timekeep.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Timekeep.apk \
            --title "Timekeep 1.0.${{ github.run_number }}" \
            --notes "Open this page on your phone and tap Timekeep.apk to install or update." \
            --latest
