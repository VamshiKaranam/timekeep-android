name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk Timekeep.apk

      - uses: actions/upload-artifact@v5
        with:
          name: Timekeep-apk
          path: Timekeep.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Timekeep.apk --clobber
          else
            gh release create "$TAG" Timekeep.apk \
              --title "Timekeep ${TAG#v}" \
              --notes "Open this page on your phone and tap Timekeep.apk to install or update." \
              --latest
          fi
